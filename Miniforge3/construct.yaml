{% set version = os.environ.get("MINIFORGE_VERSION", "26.1.0-0") %}
{% set conda_version = "26.1.0" if version.startswith("dev") else version.split("-")[0] %}
{% set conda_libmamba_solver_version = "25.11.0" %}
# This file is parsed by the scripts to define
#   - `MICROMAMBA_VERSION` in `scripts/build.sh`
#   - `MAMBA_VERSION` in `scripts/test.sh`
{% set mamba_version = "2.5.0" %}

name: Miniforge3
version: {{ version }}
company: DTU-PIS

channels:
  # specifying the channel with the full URL adds two channels
  # when the end user adds the channel without the full URL
  # - https://conda.anaconda.org/conda-forge
  - conda-forge

mirrored_channels:
  conda-forge:
    - "https://conda.anaconda.org/conda-forge"
    - "https://prefix.dev/conda-forge"

write_condarc: True
# keep pkgs for space-saving implications for hardlinks when create new environments
# and keep the same with Miniconda
keep_pkgs: True
license_file: {{ os.environ.get("MINIFORGE_LICENSE_OVERRIDE", "../LICENSE") }}

# During the interactive installation, these variables are checked.
# During batch installation, conda is never initialized
initialize_conda: True
initialize_by_default: True
post_install: post_install.sh  # [unix]
post_install: post_install.bat  # [win]

user_requested_specs:
  - python 3.12.*
  - conda >={{ conda_version }}
  - mamba >={{ mamba_version }}
  - pip
  - uv
  - dtumathtools
  - pandas
  - scipy
  - statsmodels
  - uncertainties
  # Omit conda-libmamba-solver so that conda is free to remove it later
  - miniforge_console_shortcut 1.*  # [win]

specs:
  - python 3.12.*
  - conda {{ conda_version }}
  - mamba {{ mamba_version }}
  - conda-libmamba-solver {{ conda_libmamba_solver_version }}
  - pip
  - uv
  - dtumathtools
  - pandas
  - scipy
  - statsmodels
  - uncertainties
  - miniforge_console_shortcut 1.*  # [win]

virtual_specs:
  - __glibc >=2.17 # [linux]
  - __osx >=10.13 # [osx]

# Freeze base environment to prevent students from modifying it (CEP-22)
# Requires constructor>=3.13.0
freeze_base:
  conda:
    message: |
      This base environment is frozen and cannot be modified.

      To install additional packages, create a new environment:
        conda create -n myproject python=3.12
        conda activate myproject
        conda install <your-packages>

# Pre-configured course environments
extra_envs:
  math1:
    specs:
      - python 3.12.*
      - dtumathtools

  statistics:
    specs:
      - python 3.12.*
      - statsmodels
      - dtumathtools
      - scipy

  physics:
    specs:
      - python 3.12.*
      - uncertainties
      - scipy
